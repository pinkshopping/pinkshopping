
<script type="module">
import {db} from './common.js';

const root=document.getElementById('orders');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});

let orders=[];
try{
 const saved=JSON.parse(localStorage.getItem('pink_guest_orders_v1')||'[]');
 if(Array.isArray(saved))orders=saved;
}catch(e){}

try{
 const latest=JSON.parse(sessionStorage.getItem('pink_guest_latest_order')||'null');
 if(latest&&!orders.some(o=>String(o.id)===String(latest.id)))orders.unshift(latest);
}catch(e){}

const focus=new URLSearchParams(location.search).get('order');

if(!orders.length){
 root.innerHTML='<section class="orders-card"><p>ยังไม่มีประวัติคำสั่งซื้อในอุปกรณ์นี้</p></section>';
}else{
 root.innerHTML=orders.map(o=>{
 const total=(o.items||[]).reduce((a,i)=>a+Number(i.price||0)*Number(i.quantity||0),0);
 const isCOD=o.paymentMethod==='cod';
 const payment=isCOD?'เก็บเงินปลายทาง (COD)':'โอนเงินผ่าน QR';
 const payStatus=isCOD?'รอชำระเงินปลายทาง':'รอตรวจสอบสลิป';
 return `<section class="orders-card" ${String(o.id)===focus?'style="border:2px solid #d81b73"':''}>
 ${String(o.id)===focus?'<div class="orders-success">✓ สั่งซื้อสำเร็จ!</div>':''}
 <div class="orders-row"><h2>คำสั่งซื้อ #${esc(o.id)}</h2><strong>${esc(o.status||'รอร้านยืนยัน')}</strong></div>
 <p class="orders-muted">วันที่ ${esc(new Date(o.date).toLocaleString('th-TH'))}</p>
 <h3>รายการสินค้า</h3>
 ${(o.items||[]).map(i=>`<div class="orders-item"><div class="orders-row"><span>${esc(i.name)} ${i.option?'<small>('+esc(i.option)+')</small>':''} × ${esc(i.quantity)}</span><b>฿${baht(Number(i.price)*Number(i.quantity))}</b></div></div>`).join('')}
 <p class="orders-row orders-total"><span>ยอดรวมสินค้า</span><span>฿${baht(total)}</span></p>
 <h3>💳 ข้อมูลการชำระเงิน</h3>
 <p class="orders-row"><span>วิธีชำระเงิน</span><strong>${payment}</strong></p>
 <p class="orders-row"><span>สถานะชำระเงิน</span><strong>${payStatus}</strong></p>
 <p class="orders-muted">ค่าจัดส่งและยอดชำระสุดท้ายร้านค้าจะแจ้งยืนยันอีกครั้ง</p>
 <h3>📦 ข้อมูลจัดส่ง</h3>
 <p>${esc(o.customer)} | ${esc(o.phone)}</p>
 <p>${esc(o.address)}</p>
 <p class="orders-muted">สถานะนี้เป็นข้อมูล ณ เวลาสั่งซื้อ ไม่ใช่การติดตามสถานะล่าสุดจากร้าน</p>
 </section>`;
 }).join('');
}
</script>
